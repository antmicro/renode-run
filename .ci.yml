.only_master_and_all_mrs: &only_master_and_all_mrs
  only:
    variables:
    - $CI_COMMIT_REF_NAME == "main"
    - $CI_PIPELINE_SOURCE == "merge_request"

.common-linux: &common_linux
  variables:
    SCALENODE_CPU: 2
    SCALENODE_DISK: 20
    DEBIAN_FRONTEND: "noninteractive"

.common-test: &common_test
  before_script:
    - apt -qqy update > /dev/null
    - apt -qqy install curl git python3 python3-pip python3-venv libicu-dev > /dev/null
  script:
    - python3 -V
    - python3 -m venv .venv && source .venv/bin/activate

    - git clone --single-branch --branch=main $(git remote get-url origin | sed "s/renode-run/dts2repl/") ./dts2repl ||
      git clone --single-branch --branch=main $(git remote get-url origin | sed "s/renode-run/renode-dts2repl/") ./dts2repl
    - sed -i "s|git+https://github.com/antmicro/dts2repl@main#egg=dts2repl|file://$(pwd)/dts2repl|g" pyproject.toml

    - pip3 install .
    - ./tests/test.sh

Debian Bookworm (python3.11):
  <<: *only_master_and_all_mrs
  <<: *common_linux
  <<: *common_test
  image: debian:bookworm

Debian Trixie (python3.13):
  <<: *only_master_and_all_mrs
  <<: *common_linux
  <<: *common_test
  image: debian:trixie

Ubuntu 25.04 (python3.13):
  <<: *only_master_and_all_mrs
  <<: *common_linux
  <<: *common_test
  image: ubuntu:25.04
